name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deliberately slow, so the "Claude reviews last" wait is observable.
      - run: sleep 90
      - run: node --test src/cart.test.js
